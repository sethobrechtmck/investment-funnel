<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Funnel</title>
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f9fafb; --border:#e2e4e8; --border-strong:#cfd3d9;
  --text:#15171c; --muted:#5f6670; --faint:#8b929c;
  --primary:#1d4ed8; --primary-hover:#1a43bd; --primary-ink:#ffffff; --primary-soft:#e9effd;
  --danger:#c0262d; --danger-soft:#fde8e9; --success:#1f7a4d; --success-soft:#e3f4ea;
  --warn:#c98a0b; --warn-soft:#fdf5df; --warn-border:#efd99c; --warn-ink:#6b4c08;
  --info:#2453c2; --info-soft:#e7eefc; --chip:#eef0f3; --badge:#15171c; --badge-ink:#ffffff;
  --overlay:rgba(15,17,21,.45); --shadow:0 1px 2px rgba(16,24,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --surface:#171a20; --surface-2:#1c2027; --border:#2a2f38; --border-strong:#3a404b;
    --text:#e8eaee; --muted:#a2a9b3; --faint:#737b86;
    --primary:#5b84f5; --primary-hover:#7398f7; --primary-ink:#ffffff; --primary-soft:#1c2848;
    --danger:#f0757c; --danger-soft:#3a1b1e; --success:#46b97f; --success-soft:#16301f;
    --warn:#e2ad48; --warn-soft:#2c2414; --warn-border:#54451f; --warn-ink:#ecd29a;
    --info:#8aa9f7; --info-soft:#1c2848; --chip:#252a33; --badge:#e8eaee; --badge-ink:#0f1115;
    --overlay:rgba(0,0,0,.6); --shadow:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Nav */
.nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.nav-in{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--primary);display:grid;place-items:center}
.tabs{display:flex;gap:4px;height:100%}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:0 14px;height:100%;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.count{background:var(--primary-soft);color:var(--primary);border-radius:999px;font-size:12px;font-weight:600;padding:1px 8px}
.sync{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.dot.off{background:var(--warn)}

main{max-width:1180px;margin:0 auto;padding:32px 24px 64px}

/* Wizard */
.wiz{max-width:880px;margin:0 auto}
.stepper{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--muted)}
.stp i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-size:12px;font-weight:600}
.stp.on{border-color:var(--primary);color:var(--text);font-weight:600}
.stp.on i{background:var(--primary);color:var(--primary-ink)}
.stp.done{color:var(--text);cursor:pointer}
.stp.done i{background:var(--success-soft);color:var(--success)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.panel-body{padding:28px 32px}
.panel-foot{background:var(--surface-2);border-top:1px solid var(--border);padding:16px 32px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fld{margin-bottom:20px}
.fld>label,.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.req{color:var(--danger);margin-left:2px}
.hint{color:var(--faint);font-size:13px;margin:-2px 0 8px}
.inp{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:11px 13px;outline:none}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.inp{min-height:72px;resize:vertical}
select.inp{appearance:auto}
.err .inp,.err .choices .choice{border-color:var(--danger)}
.errmsg{color:var(--danger);font-size:12px;margin-top:5px}
.choices{display:grid;gap:10px}
.choices.c2{grid-template-columns:1fr 1fr}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choices.c5{grid-template-columns:repeat(5,1fr);gap:6px}
.choice{text-align:left;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:12px 14px}
.choice b{display:block;font-size:14px}
.choice span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.choice:hover{border-color:var(--primary)}
.choice.on{border-color:var(--primary);background:var(--primary-soft)}
.choices.c5 .choice{padding:8px 4px;text-align:center}
.choices.c5 .choice span{font-size:11px}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:9px 18px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{background:var(--primary-hover)}
.btn.pri:disabled{opacity:.6;cursor:wait}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger.arm{background:var(--danger);border-color:var(--danger);color:#fff}

/* ROIC */
.roic{display:grid;grid-template-columns:1fr 220px;gap:28px;align-items:start}
.grp{font-size:12px;font-weight:600;color:var(--faint);margin:4px 0 12px;letter-spacing:.02em}
.money{position:relative}
.money em{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--faint)}
.money .inp{padding-left:28px;text-align:right;font-variant-numeric:tabular-nums}
.est{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;position:sticky;top:84px}
.est h4{margin:0 0 10px;font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.02em}
.er{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;color:var(--muted)}
.er:last-child{border-bottom:0}
.er b{color:var(--text);font-variant-numeric:tabular-nums}
.neg{color:var(--danger)!important}

/* Review step */
.rv{border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
.rv-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);border-radius:10px 10px 0 0;font-weight:600;font-size:14px}
.rv-h button{background:none;border:0;color:var(--primary);font-weight:600;font-size:13px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 16px;padding:12px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.success{text-align:center;padding:48px 32px}
.success .big{width:52px;height:52px;border-radius:50%;background:var(--success-soft);color:var(--success);display:grid;place-items:center;margin:0 auto 16px;font-size:26px}

/* Submissions */
.lh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.lh h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.lh p{margin:0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools select{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px}
.banner{background:var(--warn-soft);border:1px solid var(--warn-border);color:var(--warn-ink);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:18px}
.banner.ok{background:var(--info-soft);border-color:transparent;color:var(--info)}
details.how{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--text);font-weight:600}
details.how ul{margin:8px 0 2px;padding-left:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:border-color .12s}
.card:hover{border-color:var(--border-strong)}
.card.dragging{opacity:.4}
.card.over{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.rank{background:var(--badge);color:var(--badge-ink);font-weight:700;font-size:12px;border-radius:5px;padding:2px 7px}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.pill.must{background:var(--danger-soft);color:var(--danger)}
.st-under-review{background:var(--info-soft);color:var(--info)}
.st-approved{background:var(--success-soft);color:var(--success)}
.st-deferred{background:var(--warn-soft);color:var(--warn)}
.st-declined{background:var(--danger-soft);color:var(--danger)}
.grip{margin-left:auto;color:var(--faint);cursor:grab;padding:2px;display:flex}
.card-title{font-weight:700;font-size:15px;line-height:1.3}
.card-meta{font-size:12.5px;color:var(--faint);margin-top:3px}
.score{margin:14px 0 8px;display:flex;align-items:baseline;gap:6px}
.score b{font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score span{color:var(--faint);font-size:13px}
.score em{margin-left:auto;font-style:normal;font-size:11px;color:var(--faint)}
.bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.card-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:grid;grid-template-columns:1.3fr 1fr;gap:8px;font-size:13px;margin-top:14px}
.card-foot label{display:block;font-size:11.5px;color:var(--faint);margin-bottom:2px}
.card-foot span{font-weight:700}
.empty{text-align:center;padding:56px 24px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:12px;color:var(--muted)}

/* Modal */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:1000px;border:1px solid var(--border)}
.mh{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;gap:16px;align-items:flex-start}
.mh h3{margin:6px 0 2px;font-size:20px}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--muted);line-height:1;padding:4px}
.mb{display:grid;grid-template-columns:1fr 320px}
.mmain{padding:20px 24px;border-right:1px solid var(--border)}
.mside{padding:20px;background:var(--surface-2);border-radius:0 0 14px 0}
.sec{margin-bottom:20px}
.sec h5{margin:0 0 8px;font-size:13px;color:var(--faint);font-weight:600}
.qa{margin-bottom:12px}
.qa b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.qa p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
table.fin{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.fin td{padding:6px 0;border-bottom:1px solid var(--border)}
table.fin td:last-child{text-align:right;font-weight:600}
.brk{font-size:13px}
.brk .er{padding:6px 0}
.rvw{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;font-size:13px}
.rvw b{font-size:13px}
.rvw p{margin:3px 0 0;color:var(--muted);white-space:pre-wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--badge);color:var(--badge-ink);padding:10px 16px;border-radius:8px;font-size:14px;z-index:99}

@media (max-width:760px){
  .row2,.roic,.mb{grid-template-columns:1fr}
  .choices.c3{grid-template-columns:1fr}
  .mmain{border-right:0;border-bottom:1px solid var(--border)}
  .panel-body{padding:22px 18px}.panel-foot{padding:14px 18px}
  .kv{grid-template-columns:1fr}
  .nav-in{gap:12px;padding:0 14px}.brand span{display:none}.sync{display:none}
  .est{position:static}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const TYPES=['Headcount','IT / Systems Enhancement','Software / Licensing','Equipment / Capex','Process Improvement','Marketing / Growth','Facilities','Other'];
const STATUSES=['Submitted','Under Review','Approved','Deferred','Declined'];
const STEPS=['Header','Rationale','ROIC','Confidence','Review'];
const W={fin:35,fit:25,urg:15,rc:25};
const REQ=[['title','type','mandatory','submittedBy','sponsor','date'],['reason','capabilities','assumptions','priority','inaction','metrics'],[],['confidence','risk'],[]];
const CONF={High:5,Medium:3,Low:1}, RISK={Low:5,Medium:3,High:1};

/* ---------- Shared storage ---------- */
const hasStore = typeof window.storage!=='undefined' && !!window.storage;
const mem={};
const store={
  async get(k){ if(!hasStore) return mem[k]??null; try{const r=await window.storage.get(k,true); return r&&r.value!=null?JSON.parse(r.value):null;}catch(e){return null;} },
  async set(k,v){ if(!hasStore){mem[k]=v;return true;} try{const r=await window.storage.set(k,JSON.stringify(v),true); return !!r;}catch(e){console.error('Storage error',e);return false;} },
  async del(k){ if(!hasStore){delete mem[k];return true;} try{await window.storage.delete(k,true);return true;}catch(e){console.error('Storage error',e);return false;} },
  async list(p){ if(!hasStore) return Object.keys(mem).filter(k=>k.startsWith(p)); try{const r=await window.storage.list(p,true); return ((r&&r.keys)||[]).map(k=>typeof k==='string'?k:k.key);}catch(e){return [];} }
};

/* ---------- State ---------- */
let subs=[], ranking=[], view='submit', step=0, form=blankForm(), showErr=false, justSubmitted=null;
let filter='All', openId=null, loading=true, busy=false, lastSync=null, dragId=null, revDraft=blankReview(), delArm=false, seededTried=false;

function today(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function blankForm(){return {title:'',type:'',mandatory:null,submittedBy:'',sponsor:'',date:today(),reason:'',capabilities:'',assumptions:'',priority:'',inaction:'',metrics:'',oneTime:0,ongoing:0,y1Rev:0,y1GP:0,y2GP:0,y3GP:0,savings:0,confidence:null,risk:null};}
function blankReview(){return {reviewer:'',fit:0,urgency:0,notes:''};}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/\s+/g,'-');
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const empty=v=>v===null||v===undefined||String(v).trim()==='';
const money=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString();
function short(n){const a=Math.abs(n),s=n<0?'−$':'$';if(a>=1e6)return s+(a/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(a>=1e3)return s+Math.round(a/1e3)+'K';return s+Math.round(a);}

/* ---------- Scoring ---------- */
function calc(f){
  const n=k=>Number(f[k])||0;
  const cost=n('oneTime')+3*n('ongoing');
  const benefit=n('y1GP')+n('y2GP')+n('y3GP')+3*n('savings');
  const net=benefit-cost;
  const roi=cost>0?net/cost:null;
  let payback=null, cum=-n('oneTime');
  const monthly=[n('y1GP'),n('y2GP'),n('y3GP')].map(g=>(g+n('savings')-n('ongoing'))/12);
  if(cum>=0) payback=0;
  else{ for(let m=1;m<=36;m++){cum+=monthly[Math.floor((m-1)/12)]; if(cum>=0){payback=m;break;}}
        if(payback===null&&monthly[2]>0) payback=36+Math.ceil(-cum/monthly[2]); }
  const roiS = roi===null ? (net>=0?5:1) : roi>=2?5:roi>=1?4:roi>=.5?3:roi>=0?2:1;
  const pbS = payback===null?1:payback<=12?5:payback<=18?4:payback<=24?3:payback<=36?2:1;
  return {cost,benefit,net,roi,payback,fin:(roiS+pbS)/2};
}
function rcScore(s){ if(!s.confidence||!s.risk) return 3; return (CONF[s.confidence]+RISK[s.risk])/2; }
function scores(s){
  const c=calc(s), rc=rcScore(s), rv=s.reviews||[];
  const fit=rv.length?avg(rv.map(r=>r.fit)):3, urg=rv.length?avg(rv.map(r=>r.urgency)):3;
  const total=(W.fin*c.fin+W.fit*fit+W.urg*urg+W.rc*rc)/5;
  return {c,fin:c.fin,rc,fit,urg,total,provisional:!rv.length};
}
const fmtROI=r=>r===null?'n/a':Math.round(r*100)+'%';
const fmtPB=p=>p===null?'Never':p===0?'0 mo':p+' mo';

/* ---------- Data ---------- */
const EXAMPLES=[
 {id:'INV-001',title:'Add 2 inside sales reps (example)',type:'Headcount',mandatory:false,submittedBy:'Jordan Lee',sponsor:'VP Sales',date:today(),reason:'Inbound lead volume is up 40% and the current team can only follow up on about half within 48 hours.',capabilities:'Same-week follow-up on every inbound lead; dedicated coverage for the mid-market segment.',assumptions:'Reps ramp to full quota by month 6; 22% close rate on inbound holds.',priority:'Grow new-logo revenue 15% YoY',inaction:'Roughly $600K of pipeline per year goes stale without follow-up.',metrics:'Lead response time under 24h; $1M+ in new bookings within 12 months.',oneTime:25000,ongoing:177000,y1Rev:900000,y1GP:250000,y2GP:400000,y3GP:501000,savings:0,confidence:'Medium',risk:'Medium',status:'Under Review',reviews:[{reviewer:'Finance',fit:4,urgency:3,notes:'Ramp assumption looks reasonable.',at:Date.now()}]},
 {id:'INV-002',title:'CRM upgrade + quote automation (example)',type:'IT / Systems Enhancement',mandatory:false,submittedBy:'Priya Shah',sponsor:'COO',date:today(),reason:'Quotes are built by hand in spreadsheets, taking ~45 minutes each and causing pricing errors.',capabilities:'Quotes generated in minutes from approved price books; pipeline reporting without manual exports.',assumptions:'Vendor delivers in one quarter; reps adopt within 60 days.',priority:'Operational efficiency',inaction:'Continued pricing errors and slower quote turnaround versus competitors.',metrics:'Quote time under 10 minutes; pricing errors down 80%.',oneTime:120000,ongoing:30000,y1Rev:200000,y1GP:80000,y2GP:110000,y3GP:130000,savings:80000,confidence:'Low',risk:'Medium',status:'Submitted',reviews:[]},
 {id:'INV-003',title:'SOC 2 compliance tooling (example)',type:'Software / Licensing',mandatory:true,submittedBy:'Sam Ortiz',sponsor:'CTO',date:today(),reason:'Two enterprise clients now require SOC 2 Type II reports at renewal.',capabilities:'Continuous control monitoring and audit-ready evidence collection.',assumptions:'Audit completed within 9 months.',priority:'Security and client retention',inaction:'Risk of losing enterprise renewals that depend on SOC 2.',metrics:'SOC 2 Type II report issued within 12 months.',oneTime:40000,ongoing:25000,y1Rev:0,y1GP:0,y2GP:0,y3GP:0,savings:0,confidence:'High',risk:'Low',status:'Approved',reviews:[{reviewer:'Exec team',fit:5,urgency:5,notes:'Required by contract.',at:Date.now()}]}
];
async function seed(){
  for(const e of EXAMPLES) await store.set('sub:'+e.id,{...e,createdAt:Date.now(),example:true});
  await store.set('ranking',['INV-003','INV-001','INV-002']);
  await store.set('meta:seeded',true);
}
async function load(){
  try{
    let keys=await store.list('sub:');
    if(!keys.length && !seededTried){ seededTried=true; if(!(await store.get('meta:seeded'))){ await seed(); keys=await store.list('sub:'); } }
    const items=await Promise.all(keys.map(k=>store.get(k)));
    subs=items.filter(Boolean);
    ranking=(await store.get('ranking'))||[];
    lastSync=new Date();
  }catch(e){console.error(e); toast('Could not load submissions. Refresh to try again.');}
  loading=false; render();
}
function ordered(){
  const map=Object.fromEntries(subs.map(s=>[s.id,s]));
  const seen=new Set(), out=[];
  ranking.forEach(id=>{if(map[id]&&!seen.has(id)){out.push(map[id]);seen.add(id);}});
  subs.filter(s=>!seen.has(s.id)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(s=>out.push(s));
  return out;
}
async function saveRanking(ids){ ranking=ids; const ok=await store.set('ranking',ids); if(!ok) toast('Ranking not saved. Try again.'); }
async function nextId(){
  const keys=await store.list('sub:'); let max=0;
  keys.forEach(k=>{const m=k.match(/INV-(\d+)/); if(m) max=Math.max(max,+m[1]);});
  let n=max+1; while(await store.get('sub:INV-'+String(n).padStart(3,'0'))) n++;
  return 'INV-'+String(n).padStart(3,'0');
}

/* ---------- Render ---------- */
const app=document.getElementById('app');
function render(){
  app.innerHTML=navHTML()+`<main>${view==='submit'?wizardHTML():listHTML()}</main>`+(openId?modalHTML():'');
}
function navHTML(){
  return `<header class="nav"><div class="nav-in">
   <div class="brand"><div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg></div><span>Investment Funnel</span></div>
   <nav class="tabs"><button class="tab ${view==='submit'?'on':''}" data-view="submit">Submit an idea</button>
   <button class="tab ${view==='list'?'on':''}" data-view="list">Submissions <span class="count">${subs.length}</span></button></nav>
   <div class="sync"><span class="dot ${hasStore?'':'off'}"></span>${hasStore?'Shared workspace':'Not saved'}</div>
  </div></header>`;
}

/* Wizard */
function wizardHTML(){
  if(justSubmitted) return `<div class="wiz"><div class="panel"><div class="success"><div class="big">✓</div>
    <h2>${esc(justSubmitted.id)} submitted</h2><p class="sub" style="margin-bottom:24px">“${esc(justSubmitted.title)}” is now in the funnel and visible to everyone on the Submissions tab.</p>
    <div style="display:flex;gap:10px;justify-content:center"><button class="btn" data-act="another">Submit another idea</button><button class="btn pri" data-view="list">View submissions</button></div></div></div></div>`;
  const stepper=STEPS.map((s,i)=>`<div class="stp ${i===step?'on':i<step?'done':''}" ${i<step?`data-goto="${i}"`:''}><i>${i<step?'✓':i+1}</i>${s}</div>`).join('');
  const body=[stepHeader,stepRationale,stepROIC,stepConfidence,stepReview][step]();
  return `<div class="wiz"><div class="stepper">${stepper}</div><div class="panel"><div class="panel-body">${body}</div>
   <div class="panel-foot">${step>0?'<button class="btn" data-act="back">Back</button>':'<span></span>'}
   ${step<4?'<button class="btn pri" data-act="next">Continue</button>':`<button class="btn pri" data-act="submit" ${busy?'disabled':''}>${busy?'Submitting…':'Submit idea'}</button>`}</div></div></div>`;
}
function isErr(k){return showErr&&REQ[step].includes(k)&&empty(form[k]);}
function field(label,k,o={}){
  const e=isErr(k);
  let ctl;
  if(o.type==='textarea') ctl=`<textarea class="inp" data-field="${k}" placeholder="${esc(o.ph||'')}">${esc(form[k])}</textarea>`;
  else if(o.type==='select') ctl=`<select class="inp" data-field="${k}"><option value="">Select…</option>${o.options.map(x=>`<option ${form[k]===x?'selected':''}>${x}</option>`).join('')}</select>`;
  else ctl=`<input class="inp" type="${o.type||'text'}" data-field="${k}" value="${esc(form[k])}" placeholder="${esc(o.ph||'')}">`;
  return `<div class="fld ${e?'err':''}"><label>${label}${o.req?'<span class="req">*</span>':''}</label>${o.hint?`<div class="hint">${o.hint}</div>`:''}${ctl}${e?'<div class="errmsg">Required</div>':''}</div>`;
}
function choices(k,opts,cols){
  return `<div class="choices c${cols}">${opts.map(([v,t,s])=>`<button type="button" class="choice ${form[k]===v?'on':''}" data-choice="${k}" data-val="${v}"><b>${t}</b><span>${s}</span></button>`).join('')}</div>`;
}
function choiceField(label,k,hint,opts,cols){
  const e=isErr(k);
  return `<div class="fld ${e?'err':''}"><div class="lbl">${label}<span class="req">*</span></div>${hint?`<div class="hint">${hint}</div>`:''}${choices(k,opts,cols)}${e?'<div class="errmsg">Choose one</div>':''}</div>`;
}
function stepHeader(){
  return `<h2>1. Header</h2><p class="sub">The basics: what you're asking for, who's asking, and who's sponsoring it.</p>
  ${field('Title','title',{req:1,ph:'e.g. Add 2 inside sales reps'})}
  <div class="row2">${field('Type of ask','type',{req:1,type:'select',options:TYPES})}
   ${choiceField('Mandatory?','mandatory','Required by regulation, contract or security?',[[true,'Yes','Required'],[false,'No','Discretionary']],2)}</div>
  <div class="row2">${field('Submitted by','submittedBy',{req:1})}${field('Executive sponsor','sponsor',{req:1})}</div>
  <div class="row2">${field('Date submitted','date',{req:1,type:'date'})}<div></div></div>`;
}
function stepRationale(){
  return `<h2>2. Rationale</h2><p class="sub">Make the case. Reviewers score strategic fit and urgency from what you write here.</p>
  ${field('Reason for the ask','reason',{req:1,type:'textarea',hint:'What problem or opportunity is this addressing?'})}
  ${field('Capabilities unlocked','capabilities',{req:1,type:'textarea',hint:"What can the business do afterward that it can't do today?"})}
  ${field('Key assumptions','assumptions',{req:1,type:'textarea',hint:'What has to be true for the numbers in the next section to hold?'})}
  ${field('Strategic priority supported','priority',{req:1,hint:'Which company or department goal does this advance?'})}
  ${field('Cost of inaction','inaction',{req:1,type:'textarea',hint:"What happens if we don't fund this? Be specific about dollars, clients or risk."})}
  ${field('Success metrics','metrics',{req:1,type:'textarea',hint:'How will we know in 6–12 months whether it worked?'})}`;
}
function moneyField(label,k,hint){
  return `<div class="fld"><label>${label}</label>${hint?`<div class="hint">${hint}</div>`:''}<div class="money"><em>$</em><input class="inp" inputmode="numeric" data-money="${k}" value="${(Number(form[k])||0).toLocaleString()}"></div></div>`;
}
function estHTML(){
  const c=calc(form);
  return `<h4>LIVE ESTIMATE</h4>
   <div class="er">3-yr net benefit<b class="${c.net<0?'neg':''}">${short(c.net)}</b></div>
   <div class="er">3-yr ROI<b class="${c.roi!==null&&c.roi<0?'neg':''}">${fmtROI(c.roi)}</b></div>
   <div class="er">Payback<b>${fmtPB(c.payback)}</b></div>
   <div class="er">Financial score<b>${c.fin.toFixed(1)} / 5</b></div>`;
}
function stepROIC(){
  return `<h2>3. ROIC</h2><p class="sub">Enter whole dollars. Use 0 where something doesn't apply. Gross profit is before this investment's own costs.</p>
  <div class="roic"><div>
   <div class="row2">${moneyField('One-time investment','oneTime','Capex, implementation, recruiting')}${moneyField('Annual ongoing cost','ongoing','Salaries, licenses, maintenance')}</div>
   <div class="grp">YEAR 1</div><div class="row2">${moneyField('Y1 incremental revenue','y1Rev')}${moneyField('Y1 incremental GP','y1GP')}</div>
   <div class="grp">YEARS 2–3</div><div class="row2">${moneyField('Y2 incremental GP','y2GP')}${moneyField('Y3 incremental GP','y3GP')}</div>
   <div class="row2">${moneyField('Annual cost savings','savings','Run-rate savings or cost avoided per year')}<div></div></div>
  </div><div class="est" id="est">${estHTML()}</div></div>`;
}
function stepConfidence(){
  return `<h2>4. Confidence</h2><p class="sub">Be honest. Lower confidence doesn't sink an idea, but overstated numbers erode trust in the process.</p>
  ${choiceField('Estimate confidence','confidence','',[['High','High','Based on actuals, quotes or a proven pilot'],['Medium','Medium','Reasonable estimates with some benchmarks'],['Low','Low','Directional; significant unknowns']],3)}
  ${choiceField('Execution risk','risk','',[['Low','Low','Done before; few dependencies'],['Medium','Medium','Some complexity or vendor reliance'],['High','High','New territory or many moving parts']],3)}`;
}
function kv(rows){return `<dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;}
function stepReview(){
  const s=scores(form), c=s.c;
  return `<h2>5. Review and submit</h2><p class="sub">Check everything once more. After you submit, the idea appears on the Submissions tab for the whole team.</p>
  <div class="rv"><div class="rv-h">Header<button data-goto="0">Edit</button></div>${kv([['Title',form.title],['Type of ask',form.type],['Mandatory',form.mandatory?'Yes — required':'No — discretionary'],['Submitted by',form.submittedBy],['Executive sponsor',form.sponsor],['Date submitted',form.date]])}</div>
  <div class="rv"><div class="rv-h">Rationale<button data-goto="1">Edit</button></div>${kv([['Reason for the ask',form.reason],['Capabilities unlocked',form.capabilities],['Key assumptions',form.assumptions],['Strategic priority',form.priority],['Cost of inaction',form.inaction],['Success metrics',form.metrics]])}</div>
  <div class="rv"><div class="rv-h">ROIC<button data-goto="2">Edit</button></div>${kv([['One-time investment',money(form.oneTime)],['Annual ongoing cost',money(form.ongoing)],['Y1 revenue / GP',money(form.y1Rev)+' / '+money(form.y1GP)],['Y2 / Y3 GP',money(form.y2GP)+' / '+money(form.y3GP)],['Annual cost savings',money(form.savings)],['3-yr net benefit',money(c.net)],['3-yr ROI / payback',fmtROI(c.roi)+' / '+fmtPB(c.payback)]])}</div>
  <div class="rv"><div class="rv-h">Confidence<button data-goto="3">Edit</button></div>${kv([['Estimate confidence',form.confidence],['Execution risk',form.risk]])}</div>
  <div class="banner ok">Starting score: <b>${s.total.toFixed(1)} / 100</b>. This is provisional until a reviewer scores strategic fit and urgency.</div>`;
}

/* Submissions list */
function listHTML(){
  if(loading) return `<div class="empty">Loading submissions…</div>`;
  const all=ordered(), rows=all.map((s,i)=>({s,i})).filter(r=>filter==='All'||r.s.status===filter);
  return `<div class="lh"><div><h1>Submissions</h1><p>Drag tiles to set the ranking. Click a tile for full details and reviewer scoring.</p></div>
   <div class="tools"><select data-act="filter"><option value="All">All statuses</option>${STATUSES.map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select>
   <button class="btn sm" data-act="sort">Sort by score</button><button class="btn sm" data-act="csv">Export CSV</button><button class="btn sm" data-act="refresh">Refresh</button></div></div>
   ${hasStore?`<div class="banner ok">Shared workspace: every submission, ranking change and review here is visible to everyone who uses this app.${lastSync?` Last synced ${lastSync.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}.`:''}</div>`
     :`<div class="banner">Shared storage isn't available here, so submissions only last until you close this page. Open the app inside Claude to share it with your team.</div>`}
   <details class="how"><summary>How scoring works</summary><ul>
    <li>Overall score out of 100 = financial score (${W.fin}%) + strategic fit (${W.fit}%) + urgency (${W.urg}%) + risk & confidence (${W.rc}%), each rated 1–5.</li>
    <li>Financial score averages 3-yr ROI (≥200% = 5, ≥100% = 4, ≥50% = 3, ≥0% = 2, negative = 1) and payback (≤12 mo = 5, ≤18 = 4, ≤24 = 3, ≤36 = 2, longer = 1).</li>
    <li>3-yr ROI = (Y1–Y3 GP + 3 years of savings − one-time cost − 3 years of ongoing cost) ÷ total 3-yr cost.</li>
    <li>Risk & confidence averages estimate confidence (High 5, Medium 3, Low 1) and execution risk (Low 5, Medium 3, High 1).</li>
    <li>Strategic fit and urgency come from reviewers (averaged across reviews). Until someone reviews, both count as 3 and the score is marked provisional.</li>
    <li>Must-do items (mandatory) are flagged and placed first when you sort by score.</li></ul></details>
   ${rows.length?`<div class="grid">${rows.map(r=>cardHTML(r.s,r.i)).join('')}</div>`
     :`<div class="empty">${subs.length?'No submissions with this status.':'No ideas yet. Submit the first one to start the funnel.'}<div style="margin-top:14px"><button class="btn pri" data-view="submit">Submit an idea</button></div></div>`}`;
}
function cardHTML(s,i){
  const sc=scores(s), c=sc.c;
  const col=sc.total>=75?'var(--success)':sc.total>=60?'var(--warn)':'var(--danger)';
  return `<div class="card" draggable="true" data-id="${esc(s.id)}" tabindex="0">
   <div class="card-top"><span class="rank">#${i+1}</span>${s.mandatory?'<span class="pill must">Must-do</span>':''}<span class="pill st-${slug(s.status)}">${esc(s.status)}</span>
    <span class="grip" title="Drag to reorder"><svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="9" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="9" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="9" cy="13" r="1.4"/></svg></span></div>
   <div class="card-title">${esc(s.title)}</div><div class="card-meta">${esc(s.id)} · ${esc(s.type)}</div>
   <div class="score"><b>${sc.total.toFixed(1)}</b><span>/ 100</span>${sc.provisional?'<em>Provisional</em>':''}</div>
   <div class="bar"><i style="width:${sc.total}%;background:${col}"></i></div>
   <div class="card-foot"><div><label>3Y net benefit & ROI</label><span class="${c.net<0?'neg':''}">${short(c.net)}</span> <span style="font-weight:400;color:var(--muted)">· ${fmtROI(c.roi)}</span></div>
    <div><label>Risk & confidence</label><span>${sc.rc.toFixed(1)}</span> / 5</div></div></div>`;
}

/* Detail modal */
function modalHTML(){
  const s=subs.find(x=>x.id===openId); if(!s) return '';
  const sc=scores(s), c=sc.c, rv=s.reviews||[];
  const qa=(t,v)=>`<div class="qa"><b>${t}</b><p>${esc(v)||'—'}</p></div>`;
  const scale=(k,labels)=>`<div class="choices c5">${[1,2,3,4,5].map(n=>`<button type="button" class="choice ${revDraft[k]===n?'on':''}" data-rev="${k}" data-val="${n}"><b>${n}</b><span>${labels[n-1]}</span></button>`).join('')}</div>`;
  return `<div class="ov" data-act="closebg"><div class="modal" role="dialog" aria-modal="true">
   <div class="mh"><div><div class="card-top" style="margin:0">${s.mandatory?'<span class="pill must">Must-do</span>':''}<span class="pill st-${slug(s.status)}">${esc(s.status)}</span><span class="card-meta" style="margin:0 0 0 4px">${esc(s.id)} · ${esc(s.type)}</span></div>
    <h3>${esc(s.title)}</h3><div class="card-meta">Submitted by ${esc(s.submittedBy)} on ${esc(s.date)} · Sponsor: ${esc(s.sponsor)}</div></div>
    <button class="x" data-act="close" aria-label="Close">×</button></div>
   <div class="mb"><div class="mmain">
    <div class="sec"><h5>Rationale</h5>${qa('Reason for the ask',s.reason)}${qa('Capabilities unlocked',s.capabilities)}${qa('Key assumptions',s.assumptions)}${qa('Strategic priority supported',s.priority)}${qa('Cost of inaction',s.inaction)}${qa('Success metrics',s.metrics)}</div>
    <div class="sec"><h5>Financials</h5><table class="fin">
     <tr><td>One-time investment</td><td>${money(s.oneTime)}</td></tr><tr><td>Annual ongoing cost</td><td>${money(s.ongoing)}</td></tr>
     <tr><td>Y1 incremental revenue</td><td>${money(s.y1Rev)}</td></tr><tr><td>Y1 / Y2 / Y3 incremental GP</td><td>${money(s.y1GP)} / ${money(s.y2GP)} / ${money(s.y3GP)}</td></tr>
     <tr><td>Annual cost savings</td><td>${money(s.savings)}</td></tr><tr><td>3-yr total cost</td><td>${money(c.cost)}</td></tr><tr><td>3-yr total benefit</td><td>${money(c.benefit)}</td></tr>
     <tr><td>3-yr net benefit</td><td class="${c.net<0?'neg':''}">${money(c.net)}</td></tr><tr><td>3-yr ROI</td><td>${fmtROI(c.roi)}</td></tr><tr><td>Payback</td><td>${fmtPB(c.payback)}</td></tr></table></div>
    <div class="sec"><h5>Confidence</h5><div class="qa"><b>Estimate confidence / execution risk</b><p>${esc(s.confidence||'—')} / ${esc(s.risk||'—')}</p></div></div>
    <button class="btn sm danger ${delArm?'arm':''}" data-act="delete">${delArm?'Click again to delete permanently':'Delete submission'}</button>
   </div><div class="mside">
    <div class="sec"><h5>Overall score</h5><div class="score" style="margin:0 0 8px"><b>${sc.total.toFixed(1)}</b><span>/ 100</span>${sc.provisional?'<em>Provisional</em>':''}</div>
     <div class="brk"><div class="er">Financial (${W.fin}%)<b>${sc.fin.toFixed(1)} / 5</b></div><div class="er">Strategic fit (${W.fit}%)<b>${sc.fit.toFixed(1)} / 5</b></div>
     <div class="er">Urgency (${W.urg}%)<b>${sc.urg.toFixed(1)} / 5</b></div><div class="er">Risk & confidence (${W.rc}%)<b>${sc.rc.toFixed(1)} / 5</b></div></div></div>
    <div class="sec"><h5>Status</h5><select class="inp" data-act="status">${STATUSES.map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="sec"><h5>Add a review</h5>
     <div class="fld" style="margin-bottom:12px"><input class="inp" data-revtext="reviewer" placeholder="Your name" value="${esc(revDraft.reviewer)}"></div>
     <div class="lbl" style="font-size:13px">Strategic fit</div>${scale('fit',['Weak','Low','Fair','Strong','Core'])}
     <div class="lbl" style="font-size:13px;margin-top:12px">Urgency</div>${scale('urgency',['Can wait','Low','Moderate','High','Critical'])}
     <textarea class="inp" style="margin-top:12px;min-height:60px" data-revtext="notes" placeholder="Notes (optional)">${esc(revDraft.notes)}</textarea>
     <button class="btn pri sm" style="margin-top:10px;width:100%" data-act="review" ${busy?'disabled':''}>Save review</button></div>
    <div class="sec"><h5>Reviews (${rv.length})</h5>${rv.length?rv.map(r=>`<div class="rvw"><b>${esc(r.reviewer)}</b> · Fit ${r.fit} · Urgency ${r.urgency}<span style="float:right;color:var(--faint)">${new Date(r.at).toLocaleDateString()}</span>${r.notes?`<p>${esc(r.notes)}</p>`:''}</div>`).join(''):'<div class="card-meta">No reviews yet.</div>'}</div>
   </div></div></div></div>`;
}

/* ---------- Events ---------- */
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.field){ form[t.dataset.field]=t.value; if(showErr&&!empty(t.value)) t.closest('.fld')?.classList.remove('err'); }
  if(t.dataset.money){ let v=t.value.replace(/[^\d-]/g,'').replace(/(?!^)-/g,''); t.value=v; form[t.dataset.money]=parseInt(v,10)||0; const est=document.getElementById('est'); if(est) est.innerHTML=estHTML(); }
  if(t.dataset.revtext) revDraft[t.dataset.revtext]=t.value;
});
app.addEventListener('focusin',e=>{const t=e.target; if(t.dataset.money){t.value=form[t.dataset.money]?String(form[t.dataset.money]):''; }});
app.addEventListener('focusout',e=>{const t=e.target; if(t.dataset.money){t.value=(form[t.dataset.money]||0).toLocaleString();}});
app.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.act==='filter'){filter=t.value;render();}
  if(t.dataset.act==='status'){ await updateSub(openId,s=>{s.status=t.value;}); }
});
app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-view],[data-act],[data-goto],[data-choice],[data-rev],.card');
  if(!el) return;
  if(el.dataset.view){ view=el.dataset.view; if(view==='submit'&&justSubmitted){} if(view==='list') load(); render(); return; }
  if(el.dataset.goto!==undefined){ step=+el.dataset.goto; showErr=false; render(); window.scrollTo(0,0); return; }
  if(el.dataset.choice){ const v=el.dataset.val; form[el.dataset.choice]=v==='true'?true:v==='false'?false:v; render(); return; }
  if(el.dataset.rev){ revDraft[el.dataset.rev]=+el.dataset.val; render(); return; }
  const a=el.dataset.act;
  if(a==='next'){ if(REQ[step].some(k=>empty(form[k]))){showErr=true;render();return;} showErr=false; step++; render(); window.scrollTo(0,0); return; }
  if(a==='back'){ showErr=false; step--; render(); window.scrollTo(0,0); return; }
  if(a==='submit') return submitIdea();
  if(a==='another'){ justSubmitted=null; form=blankForm(); step=0; render(); return; }
  if(a==='sort'){ const ids=ordered().sort((x,y)=>(y.mandatory?1:0)-(x.mandatory?1:0)||scores(y).total-scores(x).total).map(s=>s.id); await saveRanking(ids); render(); return; }
  if(a==='csv') return exportCSV();
  if(a==='refresh'){ await load(); toast('Up to date'); return; }
  if(a==='close'||(a==='closebg'&&e.target===el)){ openId=null; delArm=false; render(); return; }
  if(a==='review') return saveReview();
  if(a==='delete'){ if(!delArm){delArm=true;render();return;} return deleteSub(openId); }
  if(el.classList.contains('card')&&!el.closest('.modal')){ openId=el.dataset.id; revDraft=blankReview(); delArm=false; render(); }
});
app.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&openId){openId=null;render();}
  if(e.key==='Enter'&&e.target.classList?.contains('card')){openId=e.target.dataset.id;revDraft=blankReview();render();}
});
/* Drag to rank */
app.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card'); if(!c) return; dragId=c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragId);});
app.addEventListener('dragend',e=>{dragId=null; document.querySelectorAll('.card').forEach(c=>c.classList.remove('dragging','over'));});
app.addEventListener('dragover',e=>{const c=e.target.closest?.('.card'); if(!c||!dragId) return; e.preventDefault(); document.querySelectorAll('.card.over').forEach(x=>x!==c&&x.classList.remove('over')); if(c.dataset.id!==dragId) c.classList.add('over');});
app.addEventListener('drop',async e=>{
  const c=e.target.closest?.('.card'); if(!c||!dragId) return; e.preventDefault();
  const target=c.dataset.id; if(target===dragId) return;
  const ids=ordered().map(s=>s.id), from=ids.indexOf(dragId), to=ids.indexOf(target);
  ids.splice(from,1); ids.splice(to,0,dragId); dragId=null;
  ranking=ids; render(); await saveRanking(ids);
});

/* ---------- Actions ---------- */
async function submitIdea(){
  if(busy) return; busy=true; render();
  try{
    const id=await nextId();
    const rec={...form,id,status:'Submitted',reviews:[],createdAt:Date.now()};
    const ok=await store.set('sub:'+id,rec);
    if(!ok) throw new Error('save failed');
    const r=(await store.get('ranking'))||ranking; if(!r.includes(id)) r.push(id); await store.set('ranking',r);
    justSubmitted={id,title:form.title}; form=blankForm(); step=0; showErr=false;
    await load();
  }catch(err){ console.error(err); toast('Submission not saved. Check your connection and try again.'); }
  busy=false; render();
}
async function updateSub(id,fn){
  const key='sub:'+id;
  const fresh=(await store.get(key))||subs.find(s=>s.id===id); if(!fresh) return;
  fn(fresh); const ok=await store.set(key,fresh);
  if(!ok){toast('Change not saved. Try again.');return;}
  subs=subs.map(s=>s.id===id?fresh:s); render();
}
async function saveReview(){
  if(!revDraft.reviewer.trim()||!revDraft.fit||!revDraft.urgency){toast('Add your name, a strategic fit score and an urgency score.');return;}
  busy=true; render();
  const r={...revDraft,reviewer:revDraft.reviewer.trim(),at:Date.now()};
  await updateSub(openId,s=>{s.reviews=[...(s.reviews||[]),r]; if(s.status==='Submitted') s.status='Under Review';});
  revDraft=blankReview(); busy=false; render(); toast('Review saved');
}
async function deleteSub(id){
  const ok=await store.del('sub:'+id);
  if(!ok){toast('Delete failed. Try again.');return;}
  subs=subs.filter(s=>s.id!==id); await saveRanking(ranking.filter(x=>x!==id));
  openId=null; delArm=false; render(); toast(id+' deleted');
}
function exportCSV(){
  const cols=['Rank','ID','Title','Type','Mandatory','Status','Score','Financial','Strategic fit','Urgency','Risk & confidence','Submitted by','Sponsor','Date','Reason','Capabilities unlocked','Key assumptions','Strategic priority','Cost of inaction','Success metrics','One-time','Annual ongoing','Y1 revenue','Y1 GP','Y2 GP','Y3 GP','Annual savings','3Y net benefit','3Y ROI','Payback (mo)','Confidence','Execution risk','Reviews'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=ordered().map((s,i)=>{const sc=scores(s),c=sc.c;return [i+1,s.id,s.title,s.type,s.mandatory?'Yes':'No',s.status,sc.total.toFixed(1),sc.fin.toFixed(1),sc.fit.toFixed(1),sc.urg.toFixed(1),sc.rc.toFixed(1),s.submittedBy,s.sponsor,s.date,s.reason,s.capabilities,s.assumptions,s.priority,s.inaction,s.metrics,s.oneTime,s.ongoing,s.y1Rev,s.y1GP,s.y2GP,s.y3GP,s.savings,Math.round(c.net),c.roi===null?'':Math.round(c.roi*100)+'%',c.payback??'Never',s.confidence,s.risk,(s.reviews||[]).map(r=>`${r.reviewer}: fit ${r.fit}, urgency ${r.urgency}${r.notes?' — '+r.notes:''}`).join(' | ')].map(q).join(',');});
  const blob=new Blob([[cols.map(q).join(','),...rows].join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='investment-funnel-'+today()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}
let tt; function toast(m){ document.querySelector('.toast')?.remove(); const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); clearTimeout(tt); tt=setTimeout(()=>d.remove(),2800); }

/* Keep the list fresh as teammates submit */
setInterval(()=>{ if(view==='list'&&!openId&&!dragId&&!busy) load(); },30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&view==='list'&&!openId) load(); });

render(); load();
</script>
