   SharePoint list's own permissions.

window.FUNNEL_CONFIG = {
  // Directory (tenant) ID from the app registration's Overview page.
  tenantId: 'YOUR-TENANT-ID',

  // Application (client) ID from the app registration's Overview page.
  clientId: 'YOUR-CLIENT-ID',

  // Optional. If IT gives you the Graph site ID (hostname,siteCollectionId,webId),

  siteId: '',

  // Display name of the SharePoint list.

  // Delegated Microsoft Graph permissions to request. Must match what IT granted:

  scopes: ['Sites.Selected'],

  redirectUri: ''
};

/* Column display names in the SharePoint list. Only change these if you renamed
   a column. The app looks up each column's internal name from Graph at sign-in. */
window.FUNNEL_COLUMNS = {
  title:'Title', type:'Type of ask', mandatory:'Mandatory', submittedBy:'Submitted by', sponsor:'Executive sponsor',
  date:'Date submitted', reason:'Reason for the ask', capabilities:'Capabilities unlocked', assumptions:'Key assumptions',
  priority:'Strategic priority', inaction:'Cost of inaction', metrics:'Success metrics',
  oneTime:'One-time investment', ongoing:'Annual ongoing cost', y1Rev:'Y1 revenue', y1GP:'Y1 GP', y2GP:'Y2 GP', y3GP:'Y3 GP',
  savings:'Annual cost savings', confidence:'Estimate confidence', risk:'Execution risk', status:'Status',
  fit:'Strategic fit', urgency:'Urgency', notes:'Reviewer notes', rank:'Rank'
};

<style>

/* Modal */

<body>
<div id="app"></div>
<script>
const CONFIG=window.FUNNEL_CONFIG, COLUMN_NAMES=window.FUNNEL_COLUMNS;
const GRAPH='https://graph.microsoft.com/v1.0';
const DRAFT_KEY='investment-funnel:draft';

const TYPES=['Headcount','IT / Systems Enhancement','Software / Licensing','Equipment / Capex','Process Improvement','Marketing / Growth','Facilities','Other'];
const STATUSES=['Submitted','Under Review','Approved','Deferred','Declined'];
const STEPS=['Header','Rationale','ROIC','Confidence','Review'];
const W={fin:35,fit:25,urg:15,rc:25};
const REQ=[['title','type','mandatory','submittedBy','sponsor','date'],['reason','capabilities','assumptions','priority','inaction','metrics'],[],['confidence','risk'],[]];
const CONF={High:5,Medium:3,Low:1}, RISK={Low:5,Medium:3,High:1};
const MONEY_KEYS=['oneTime','ongoing','y1Rev','y1GP','y2GP','y3GP','savings'];
const NULLABLE_NUM_KEYS=['fit','urgency','rank'];

/* ---------- State ---------- */
let phase='starting', gateErr=null, gateNote=null;          // phase: config | starting | signin | error | app
let msalApp=null, account=null, siteId=null, listId=null, COLS={};
let subs=[], view='submit', step=0, form=null, showErr=false, justSubmitted=null;
let filter='All', openId=null, loading=true, busy=false, lastSync=null, dragId=null, revDraft=null, delArm=false;

function today(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function blankForm(){return {title:'',type:'',mandatory:null,submittedBy:account?.name||'',sponsor:'',date:today(),reason:'',capabilities:'',assumptions:'',priority:'',inaction:'',metrics:'',oneTime:0,ongoing:0,y1Rev:0,y1GP:0,y2GP:0,y3GP:0,savings:0,confidence:null,risk:null};}
function reviewFor(s){return {reviewer:account?.name||'',fit:s?.fit||0,urgency:s?.urgency||0,notes:''};}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/\s+/g,'-');
const empty=v=>v===null||v===undefined||String(v).trim()==='';
const money=n=>{n=Number(n)||0;return (n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString();};
function short(n){const a=Math.abs(n),s=n<0?'−$':'$';if(a>=1e6)return s+(a/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(a>=1e3)return s+Math.round(a/1e3)+'K';return s+Math.round(a);}

/* ---------- Scoring (unchanged from the original app; matches the list's calculated columns) ---------- */
function calc(f){
  const n=k=>Number(f[k])||0;
  const cost=n('oneTime')+3*n('ongoing');
  const benefit=n('y1GP')+n('y2GP')+n('y3GP')+3*n('savings');
  const net=benefit-cost;
  const roi=cost>0?net/cost:null;
  let payback=null, cum=-n('oneTime');
  const monthly=[n('y1GP'),n('y2GP'),n('y3GP')].map(g=>(g+n('savings')-n('ongoing'))/12);
  if(cum>=0) payback=0;
  else{ for(let m=1;m<=36;m++){cum+=monthly[Math.floor((m-1)/12)]; if(cum>=0){payback=m;break;}}
        if(payback===null&&monthly[2]>0) payback=36+Math.ceil(-cum/monthly[2]); }
  const roiS = roi===null ? (net>=0?5:1) : roi>=2?5:roi>=1?4:roi>=.5?3:roi>=0?2:1;
  const pbS = payback===null?1:payback<=12?5:payback<=18?4:payback<=24?3:payback<=36?2:1;
  return {cost,benefit,net,roi,payback,fin:(roiS+pbS)/2};
}
function rcScore(s){ if(!s.confidence||!s.risk) return 3; return ((CONF[s.confidence]??3)+(RISK[s.risk]??3))/2; }
function scores(s){
  const c=calc(s), rc=rcScore(s);
  const reviewed=s.fit!=null&&s.urgency!=null;
  const fit=s.fit!=null?s.fit:3, urg=s.urgency!=null?s.urgency:3;
  const total=(W.fin*c.fin+W.fit*fit+W.urg*urg+W.rc*rc)/5;
  return {c,fin:c.fin,rc,fit,urg,total,provisional:!reviewed};
}
const fmtROI=r=>r===null?'n/a':Math.round(r*100)+'%';
const fmtPB=p=>p===null?'Never':p===0?'0 mo':p+' mo';

/* =====================================================================
   Auth (MSAL.js, authorization code flow with PKCE, redirect-based)
   ===================================================================== */
class AuthRequired extends Error{}
class GraphError extends Error{ constructor(status,code,message,requestId){ super(message); Object.assign(this,{status,code,requestId}); } }
class SetupError extends Error{ constructor(title,detail,items){ super(title); Object.assign(this,{title,detail,items}); } }

function redirectUri(){ return CONFIG.redirectUri || (location.origin+location.pathname.replace(/index\.html$/i,'')); }
function configProblems(){
  const p=[], ph=v=>!v||/YOUR-|<|>/.test(v);
  if(location.protocol==='file:') p.push('This page was opened as a local file. Microsoft sign-in only works over http(s): open it from GitHub Pages, or from a local web server for testing.');
  if(ph(CONFIG.tenantId)) p.push('tenantId is not set.');
  if(ph(CONFIG.clientId)) p.push('clientId is not set.');
  if(!CONFIG.siteId && (ph(CONFIG.siteUrl)||!/^https:\/\//i.test(CONFIG.siteUrl))) p.push('siteUrl is not set (or siteId).');
  if(empty(CONFIG.listName)) p.push('listName is not set.');
  if(!Array.isArray(CONFIG.scopes)||!CONFIG.scopes.length) p.push('scopes is empty.');
  if(typeof msal==='undefined') p.push('The sign-in library (vendor/msal-browser.min.js) did not load. Make sure the vendor folder was published with index.html.');
  return p;
}

function authErrorInfo(e){
  const code=e?.errorCode||e?.code||'';
  const msg=String(e?.errorMessage||e?.message||e||'');
  const aad=(msg.match(/AADSTS\d+/)||[])[0]||'';
  const R=redirectUri();
  const M={
    AADSTS50011:['This page’s address isn’t registered for sign-in',`The app registration has no redirect URI matching ${R}. Ask IT to add exactly that address under Authentication › Single-page application.`],
    AADSTS9002326:['App registration uses the wrong platform','The redirect URI is registered under “Web”. Ask IT to move it to the “Single-page application” platform.'],
    AADSTS7000218:['App registration uses the wrong platform','The redirect URI is registered under “Web”. Ask IT to move it to the “Single-page application” platform.'],
    AADSTS700016:['App not found in your organization','The client ID in the config doesn’t match an app registration in this tenant. Check clientId and tenantId in the config block.'],
    AADSTS90002:['Tenant not found','The tenantId in the config is wrong. Copy the Directory (tenant) ID from the app registration’s Overview page.'],
    AADSTS65001:['Admin consent needed','Your organization requires an administrator to approve this app’s Microsoft Graph permissions. Ask IT to select “Grant admin consent” on the app registration’s API permissions page.'],
    AADSTS90094:['Admin consent needed','Your organization requires an administrator to approve this app’s Microsoft Graph permissions. Ask IT to select “Grant admin consent” on the app registration’s API permissions page.'],
    AADSTS65004:['Consent was declined','You declined the permission request. Sign in again and accept, or ask IT to grant admin consent.'],
    AADSTS50105:['You’re not assigned to this app','The app only allows assigned users. Ask IT to add you (or your team’s group) under Enterprise applications › Users and groups.'],
    AADSTS53003:['Blocked by an access policy','Your organization’s Conditional Access policy blocked this sign-in. Try from a company-managed device or on VPN, or contact IT.'],
    AADSTS50020:['That account isn’t in this organization','Sign in with your work account.'],
    AADSTS50076:['Additional verification required','Sign in again and complete multi-factor authentication.'],
  };
  if(M[aad]) return {title:M[aad][0],detail:M[aad][1],code:aad};
  if(code==='user_cancelled') return {title:'Sign-in was cancelled',detail:'Select “Sign in with Microsoft” to try again.',code};
  if(code==='interaction_in_progress') return {title:'A sign-in is already in progress',detail:'Wait a moment and reload the page.',code};
  if(code==='consent_required') return {title:'Permission approval needed',detail:'Sign in again to approve the app’s permissions. If you can’t, ask IT to grant admin consent.',code};
  return {title:'Sign-in failed',detail:msg||'An unknown error occurred.',code:code||aad};
}

async function startAuth(){
  msalApp=new msal.PublicClientApplication({
    auth:{clientId:CONFIG.clientId, authority:`https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri:redirectUri(), postLogoutRedirectUri:redirectUri(), navigateToLoginRequestUrl:false},
    cache:{cacheLocation:'localStorage'}
  });
  await msalApp.initialize();
  const res=await msalApp.handleRedirectPromise();
  if(res?.account) msalApp.setActiveAccount(res.account);
  account=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0]||null;
  if(account) msalApp.setActiveAccount(account);
}
async function signIn(){
  saveDraft();
  try{ await msalApp.loginRedirect({scopes:CONFIG.scopes, prompt:'select_account'}); }
  catch(e){ console.error(e); gateErr=authErrorInfo(e); phase='signin'; render(); }
}
async function signOut(){
  const a=account; account=null;
  try{ await msalApp.logoutRedirect({account:a, postLogoutRedirectUri:redirectUri()}); }
  catch(e){ console.error(e); phase='signin'; render(); }
}
async function getToken(force){
  try{ return (await msalApp.acquireTokenSilent({scopes:CONFIG.scopes, account, forceRefresh:!!force})).accessToken; }
  catch(e){
    if(e instanceof msal.InteractionRequiredAuthError || /interaction_required|login_required|consent_required|no_tokens_found|no_account/i.test(e?.errorCode||'')){
      saveDraft(); openId=null; phase='signin';
      gateNote='Your session has expired. Sign in again to continue. Anything you were typing in the form has been kept.';
      if(e?.errorCode==='consent_required') gateErr=authErrorInfo(e);
      render(); throw new AuthRequired();
    }
    throw e;
  }
}

/* =====================================================================
   Microsoft Graph
   ===================================================================== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function graph(path,{method='GET',body}={}){
  const url=path.startsWith('http')?path:GRAPH+path;
  let force=false;
  for(let attempt=0;;attempt++){
    const t=await getToken(force);
    let res;
    try{ res=await fetch(url,{method,headers:{Authorization:'Bearer '+t,Accept:'application/json',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined}); }
    catch(netErr){ throw new GraphError(0,'network','Couldn’t reach Microsoft Graph. Check your network connection or VPN and try again.'); }
    if(res.status===401&&!force){ force=true; continue; }
    if([429,503,504].includes(res.status)&&attempt<4){ await sleep((Number(res.headers.get('Retry-After'))||2**attempt)*1000); continue; }
    if(res.status===204) return null;
    const data=await res.json().catch(()=>null);
    if(!res.ok) throw new GraphError(res.status,data?.error?.code||'',data?.error?.message||res.statusText,res.headers.get('request-id')||data?.error?.innerError?.['request-id']||'');
    return data;
  }
}
async function graphAll(path){ const out=[]; let url=path; while(url){ const d=await graph(url); out.push(...(d.value||[])); url=d['@odata.nextLink']; } return out; }
const listPath=()=>`/sites/${siteId}/lists/${listId}`;

/* Up to 20 PATCH requests per Graph $batch call; throttled requests are retried. */
async function batchPatch(updates){
  for(let i=0;i<updates.length;i+=20){
    let pending=updates.slice(i,i+20);
    for(let attempt=0;pending.length;attempt++){
      const res=await graph('/$batch',{method:'POST',body:{requests:pending.map((u,j)=>({id:String(j),method:'PATCH',url:`${listPath()}/items/${u.itemId}/fields`,headers:{'Content-Type':'application/json'},body:u.fields}))}});
      const byId=Object.fromEntries((res.responses||[]).map(r=>[r.id,r]));
      const throttled=[], failed=[];
      pending.forEach((u,j)=>{ const r=byId[String(j)]; if(!r||r.status<300) return; (r.status===429||r.status===503)?throttled.push(u):failed.push(r); });
      if(failed.length){ const b=failed[0]; throw new GraphError(b.status,b.body?.error?.code||'',b.body?.error?.message||'Update failed'); }
      if(throttled.length&&attempt>=3) throw new GraphError(429,'throttled','SharePoint is busy right now. Try again in a minute.');
      if(throttled.length) await sleep(2000*(attempt+1));
      pending=throttled;
    }
  }
}

/* ---------- Connect: resolve site, list and column internal names ---------- */
function sitePathFromUrl(raw){
  const u=new URL(raw);
  let p=decodeURIComponent(u.pathname).replace(/\/(Lists|SitePages|_layouts|Shared Documents|Forms)\/.*$/i,'').replace(/\/+$/,'');
  return p?`/sites/${u.hostname}:${encodeURI(p)}`:`/sites/${u.hostname}`;
}
function columnKind(c){
  if(c.boolean) return 'boolean';
  if(c.number||c.currency) return 'number';
  if(c.dateTime) return 'date';
  if(c.choice) return 'choice';
  return 'text';
}
async function connect(){
  phase='starting'; gateErr=null; render();
  let stage='site';
  try{
    if(CONFIG.siteId) siteId=CONFIG.siteId;
    else siteId=(await graph(sitePathFromUrl(CONFIG.siteUrl)+'?$select=id,displayName,webUrl')).id;

    stage='list';
    const lists=await graphAll(`/sites/${siteId}/lists?$select=id,displayName,name`);
    const want=CONFIG.listName.trim().toLowerCase();
    const list=lists.find(l=>(l.displayName||'').trim().toLowerCase()===want)||lists.find(l=>(l.name||'').toLowerCase()===want);
    if(!list) throw new SetupError(`List “${CONFIG.listName}” not found`,
      `Signed in fine, but there’s no list with that name on the site that your account can see. Check listName in the config, or ask the list owner to share it with you.`,
      lists.length?['Lists you can see on this site: '+lists.slice(0,12).map(l=>l.displayName).join(', ')+(lists.length>12?', …':'')]:[]);
    listId=list.id;

    stage='columns';
    const cols=await graphAll(`${listPath()}/columns`);
    const byDisplay={};
    cols.forEach(c=>{ const k=(c.displayName||'').trim().toLowerCase(); const prev=byDisplay[k];
      const usable=!c.readOnly||c.name==='Title';
      if(usable&&(!prev||(prev.hidden&&!c.hidden))) byDisplay[k]=c; });
    const missing=[]; COLS={};
    for(const [key,display] of Object.entries(COLUMN_NAMES)){
      const c=key==='title'?(cols.find(x=>x.name==='Title')||byDisplay['title']):byDisplay[display.trim().toLowerCase()];
      if(!c){ missing.push(display); continue; }
      const choices=c.choice?.choices||[];
      COLS[key]={name:c.name, display:c.displayName, kind:columnKind(c), rich:c.text?.textType==='richText',
        dateOnly:c.dateTime?.format==='dateOnly', choices,
        yes:choices.find(x=>/^yes/i.test(x))||'Yes - required', no:choices.find(x=>/^no/i.test(x))||'No - discretionary'};
    }
    if(missing.length) throw new SetupError('The list is missing some columns',
      'These columns from the setup workbook weren’t found on the list (matched by display name). Add or rename them in SharePoint so the names match exactly, or update FUNNEL_COLUMNS in the config.',missing);

    restoreDraft();
    phase='app'; render(); await load();
  }catch(e){
    if(e instanceof AuthRequired) return;
    console.error(e);
    gateErr=e instanceof SetupError?{title:e.title,detail:e.detail,items:e.items}:graphErrorInfo(e,stage);
    phase='error'; render();
  }
}
function graphErrorInfo(e,stage){
  const where=stage==='site'?'the SharePoint site':'the Investment Funnel list';
  const info={code:e.code?`${e.status} ${e.code}`:String(e.status||''),requestId:e.requestId};
  if(e.status===0) return {...info,title:'Can’t reach Microsoft 365',detail:e.message};
  if(e.status===401) return {...info,title:'Microsoft Graph rejected the sign-in',detail:`Try signing out and in again. If it keeps happening, the app registration may not have the permission(s) in the config (${CONFIG.scopes.join(', ')}) or admin consent hasn’t been granted.`};
  if(e.status===403) return {...info,title:'You don’t have access to this list',detail:`You signed in as ${account?.username||'your work account'}, but SharePoint denied access to ${where}. Ask the list owner to share the list with you (Can view to see ideas, Can edit to submit and score). If nobody can get in, IT may still need to grant this app access to the site.`};
  if(e.status===404&&stage==='site') return {...info,title:'SharePoint site not found',detail:`Couldn’t find ${CONFIG.siteUrl}. Check siteUrl in the config. SharePoint also answers “not found” when your account has no access to the site, or when the app hasn’t been granted access to it (Sites.Selected).`};
  if(e.status===404) return {...info,title:'List not found',detail:`Couldn’t open ${where}. Check listName in the config, or ask the list owner for access.`};
  if(e.status===400&&stage==='site') return {...info,title:'The site address looks wrong',detail:`Graph couldn’t read ${CONFIG.siteUrl}. Use the site’s home address, e.g. https://contoso.sharepoint.com/sites/YourSite.`};
  return {...info,title:'Something went wrong talking to SharePoint',detail:e.message||String(e)};
}

/* ---------- Field mapping: app record ⇄ SharePoint fields ---------- */
function htmlToText(v){
  if(!/<[a-z][\s\S]*>/i.test(v)) return v;
  const html=v.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|li)>/gi,'\n');
  return (new DOMParser().parseFromString(html,'text/html').body.textContent||'').replace(/\n{3,}/g,'\n\n').trim();
}
const textToHtml=v=>esc(v).replace(/\n/g,'<br>');
function decode(key,v){
  const col=COLS[key];
  if(key==='mandatory') return v===true||/^yes/i.test(String(v??''));
  if(MONEY_KEYS.includes(key)){ const n=Number(v); return isFinite(n)&&v!==null&&v!==''?n:0; }
  if(NULLABLE_NUM_KEYS.includes(key)){ if(v===null||v===undefined||v==='') return null; const n=Number(v); return isFinite(n)?n:null; }
  if(key==='date'){ if(!v) return ''; const d=new Date(v); if(isNaN(d)) return String(v).slice(0,10); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
  if(v===null||v===undefined) return '';
  return col?.kind==='text'?htmlToText(String(v)):String(v);
}
function encode(key,v){
  const col=COLS[key];
  if(key==='mandatory') return col.kind==='boolean'?!!v:(v?col.yes:col.no);
  if(v===null||v===undefined||v==='') return null;
  switch(col.kind){
    case 'number': { const n=Number(v); return isFinite(n)?n:null; }
    case 'boolean': return !!v;
    case 'date': return /^\d{4}-\d{2}-\d{2}$/.test(v)?v+'T12:00:00Z':v;
    case 'text': return col.rich?textToHtml(String(v)):String(v);
    default: return String(v);
  }
}
function toFields(obj,{skipNull=false}={}){
  const f={};
  for(const [k,v] of Object.entries(obj)){ if(!COLS[k]) continue; const ev=encode(k,v); if(skipNull&&ev===null) continue; f[COLS[k].name]=ev; }
  return f;
}
function fromItem(it){
  const f=it.fields||{}, s={itemId:it.id, id:'INV-'+String(it.id).padStart(3,'0'), createdAt:Date.parse(it.createdDateTime)||0, createdBy:it.createdBy?.user?.displayName||''};
  for(const k of Object.keys(COLS)) s[k]=decode(k,f[COLS[k].name]);
  if(!s.status) s.status='Submitted';
  return s;
}

/* ---------- Data ---------- */
async function load(){
  try{
    const sel=[...new Set(Object.values(COLS).map(c=>c.name))].join(',');
    const items=await graphAll(`${listPath()}/items?$select=id,createdDateTime,createdBy&$expand=fields($select=${sel})&$top=200`);
    subs=items.map(fromItem);
    lastSync=new Date();
  }catch(e){ if(e instanceof AuthRequired) return; console.error(e); toast(e.status===403?'You don’t have access to read this list. Ask the list owner to share it with you.':'Could not load submissions. '+(e.message||'Refresh to try again.'),7000); }
  loading=false; render();
}
function ordered(){
  const byCreated=(a,b)=>(a.createdAt||0)-(b.createdAt||0);
  const ranked=subs.filter(s=>s.rank!=null).sort((a,b)=>a.rank-b.rank||byCreated(a,b));
  return [...ranked,...subs.filter(s=>s.rank==null).sort(byCreated)];
}
async function saveRanking(ids){
  const map=Object.fromEntries(subs.map(s=>[s.id,s])), prev=subs.map(s=>[s,s.rank]), updates=[];
  ids.forEach((id,i)=>{ const s=map[id]; if(!s) return; if(s.rank!==i+1) updates.push({itemId:s.itemId,fields:toFields({rank:i+1})}); s.rank=i+1; });
  render();
  if(!updates.length) return;
  try{ await batchPatch(updates); }
  catch(e){ prev.forEach(([s,r])=>s.rank=r); render(); writeErr(e,'Ranking'); }
}
function writeErr(e,what){
  if(e instanceof AuthRequired) return;
  console.error(e);
  if(e.status===403) toast(`${what} not saved: your account has view-only access to the list. Ask the list owner for edit access.`,7000);
  else if(e.status===404) toast(`${what} not saved: that item no longer exists. Refresh to see the latest list.`,6000);
  else toast(`${what} not saved. ${e.message||'Try again.'}`,7000);
}

/* ---------- Draft (survives the sign-in redirect) ---------- */
function saveDraft(){ try{ if(form) sessionStorage.setItem(DRAFT_KEY,JSON.stringify({form,step,view})); }catch(e){} }
function clearDraft(){ try{ sessionStorage.removeItem(DRAFT_KEY); }catch(e){} }
function restoreDraft(){
  try{ const d=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||'null'); if(d?.form){ form={...blankForm(),...d.form}; step=d.step||0; view=d.view||'submit'; return; } }catch(e){}
  if(!form) form=blankForm();
}

  return `<div class="alert ${cls}" role="alert"><b>${esc(err.title)}</b><p>${esc(err.detail)}</p>${err.items?.length?`<ul>${err.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}</div>`;

function diagHTML(err){
  const bits=[];
  if(err?.code) bits.push(`Error: <code>${esc(err.code)}</code>`);

function isErr(k){return showErr&&REQ[step].includes(k)&&empty(form[k]);}
function field(label,k,o={}){

function choices(k,opts,cols){

function stepHeader(){

function stepRationale(){

/* ---------- Events ---------- */
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.field){ form[t.dataset.field]=t.value; if(showErr&&!empty(t.value)) t.closest('.fld')?.classList.remove('err'); saveDraft(); }
  if(t.dataset.money){ let v=t.value.replace(/[^\d-]/g,'').replace(/(?!^)-/g,''); t.value=v; form[t.dataset.money]=parseInt(v,10)||0; const est=document.getElementById('est'); if(est) est.innerHTML=estHTML(); saveDraft(); }
  if(t.dataset.revtext) revDraft[t.dataset.revtext]=t.value;
});
app.addEventListener('focusin',e=>{const t=e.target; if(t.dataset.money){t.value=form[t.dataset.money]?String(form[t.dataset.money]):''; }});
app.addEventListener('focusout',e=>{const t=e.target; if(t.dataset.money){t.value=(form[t.dataset.money]||0).toLocaleString();}});
app.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.act==='filter'){filter=t.value;render();}
  if(t.dataset.act==='status'){ await updateSub(openId,{status:t.value},'Status'); }
});
app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-view],[data-act],[data-goto],[data-choice],[data-rev],.card');
  if(!el) return;
  const a=el.dataset.act;
  if(a==='signin') return signIn();
  if(a==='signout') return signOut();
  if(a==='retry') return connect();
  if(el.dataset.view){ view=el.dataset.view; if(view==='list') load(); render(); return; }
  if(el.dataset.goto!==undefined){ step=+el.dataset.goto; showErr=false; render(); window.scrollTo(0,0); return; }
  if(el.dataset.choice){ const v=el.dataset.val; form[el.dataset.choice]=v==='true'?true:v==='false'?false:v; saveDraft(); render(); return; }
  if(el.dataset.rev){ revDraft[el.dataset.rev]=+el.dataset.val; render(); return; }
  if(a==='next'){ if(REQ[step].some(k=>empty(form[k]))){showErr=true;render();return;} showErr=false; step++; saveDraft(); render(); window.scrollTo(0,0); return; }
  if(a==='back'){ showErr=false; step--; saveDraft(); render(); window.scrollTo(0,0); return; }
  if(a==='submit') return submitIdea();
  if(a==='another'){ justSubmitted=null; form=blankForm(); step=0; render(); return; }
  if(a==='sort'){ const ids=ordered().sort((x,y)=>(y.mandatory?1:0)-(x.mandatory?1:0)||scores(y).total-scores(x).total).map(s=>s.id); await saveRanking(ids); return; }
  if(a==='csv') return exportCSV();
  if(a==='refresh'){ await load(); toast('Up to date'); return; }
  if(a==='close'||(a==='closebg'&&e.target===el)){ openId=null; delArm=false; render(); return; }
  if(a==='review') return saveReview();
  if(a==='delete'){ if(!delArm){delArm=true;render();return;} return deleteSub(openId); }
  if(el.classList.contains('card')&&!el.closest('.modal')){ openId=el.dataset.id; revDraft=reviewFor(subs.find(s=>s.id===openId)); delArm=false; render(); }
});
app.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&openId){openId=null;render();}
  if(e.key==='Enter'&&e.target.classList?.contains('card')){openId=e.target.dataset.id;revDraft=reviewFor(subs.find(s=>s.id===openId));render();}
});
/* Drag to rank (writes the Rank column) */
app.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card'); if(!c) return; dragId=c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragId);});
app.addEventListener('dragend',e=>{dragId=null; document.querySelectorAll('.card').forEach(c=>c.classList.remove('dragging','over'));});
app.addEventListener('dragover',e=>{const c=e.target.closest?.('.card'); if(!c||!dragId) return; e.preventDefault(); document.querySelectorAll('.card.over').forEach(x=>x!==c&&x.classList.remove('over')); if(c.dataset.id!==dragId) c.classList.add('over');});
app.addEventListener('drop',async e=>{
  const c=e.target.closest?.('.card'); if(!c||!dragId) return; e.preventDefault();
  const target=c.dataset.id; if(target===dragId) return;
  const ids=ordered().map(s=>s.id), from=ids.indexOf(dragId), to=ids.indexOf(target);
  ids.splice(from,1); ids.splice(to,0,dragId); dragId=null;
  await saveRanking(ids);
});

/* ---------- Actions ---------- */
async function submitIdea(){
  if(busy) return; busy=true; render();
  try{
    const maxRank=subs.reduce((m,s)=>s.rank!=null&&s.rank>m?s.rank:m,0);
    const {fit,urgency,notes,...rest}=form;
    const created=await graph(`${listPath()}/items`,{method:'POST',body:{fields:toFields({...rest,status:'Submitted',rank:maxRank+1},{skipNull:true})}});
    const rec=fromItem({...created,fields:{...created.fields}});
    justSubmitted={id:rec.id,title:form.title}; form=blankForm(); step=0; showErr=false; clearDraft();
    busy=false; await load();
  }catch(err){
    busy=false;
    if(!(err instanceof AuthRequired)){
      console.error(err);
      if(err.status===403) toast('Submission not saved: your account can view the list but not add to it. Ask the list owner for edit (or contribute) access. Your draft is kept.',8000);
      else toast('Submission not saved. '+(err.message||'Check your connection and try again.')+' Your draft is kept.',8000);
    }
  }
  render();
}
async function updateSub(id,changes,what){
  const s=subs.find(x=>x.id===id); if(!s) return false;
  try{
    await graph(`${listPath()}/items/${s.itemId}/fields`,{method:'PATCH',body:toFields(changes)});
    Object.assign(s,changes); render(); return true;
  }catch(e){ writeErr(e,what); render(); return false; }
}
async function saveReview(){
  if(!revDraft.reviewer.trim()||!revDraft.fit||!revDraft.urgency){toast('Add your name, a strategic fit score and an urgency score.');return;}
  const s=subs.find(x=>x.id===openId); if(!s) return;
  busy=true; render();
  try{
    // Re-read the notes so a teammate's review saved a moment ago isn't overwritten.
    const fresh=await graph(`${listPath()}/items/${s.itemId}?$select=id&$expand=fields($select=${COLS.notes.name})`);
    const prior=decode('notes',fresh?.fields?.[COLS.notes.name]);
    const line=`${today()} · ${revDraft.reviewer.trim()} · fit ${revDraft.fit}, urgency ${revDraft.urgency}`+(revDraft.notes.trim()?`\n${revDraft.notes.trim()}`:'');
    const changes={fit:revDraft.fit,urgency:revDraft.urgency,notes:prior?prior+'\n\n'+line:line};
    if(s.status==='Submitted') changes.status='Under Review';
    const ok=await updateSub(openId,changes,'Review');
    if(ok){ revDraft=reviewFor(s); toast('Review saved'); }
  }catch(e){ writeErr(e,'Review'); }
  busy=false; render();
}
async function deleteSub(id){
  const s=subs.find(x=>x.id===id); if(!s) return;
  try{ await graph(`${listPath()}/items/${s.itemId}`,{method:'DELETE'}); }
  catch(e){ writeErr(e,'Delete'); return; }
  subs=subs.filter(x=>x.id!==id);
  openId=null; delArm=false; render(); toast(id+' deleted');
}
function exportCSV(){
  const cols=['Rank','ID','Title','Type','Mandatory','Status','Score','Financial','Strategic fit','Urgency','Risk & confidence','Submitted by','Sponsor','Date','Reason','Capabilities unlocked','Key assumptions','Strategic priority','Cost of inaction','Success metrics','One-time','Annual ongoing','Y1 revenue','Y1 GP','Y2 GP','Y3 GP','Annual savings','3Y net benefit','3Y ROI','Payback (mo)','Confidence','Execution risk','Reviewer notes'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=ordered().map((s,i)=>{const sc=scores(s),c=sc.c;return [i+1,s.id,s.title,s.type,s.mandatory?'Yes':'No',s.status,sc.total.toFixed(1),sc.fin.toFixed(1),sc.fit.toFixed(1),sc.urg.toFixed(1),sc.rc.toFixed(1),s.submittedBy,s.sponsor,s.date,s.reason,s.capabilities,s.assumptions,s.priority,s.inaction,s.metrics,s.oneTime,s.ongoing,s.y1Rev,s.y1GP,s.y2GP,s.y3GP,s.savings,Math.round(c.net),c.roi===null?'':Math.round(c.roi*100)+'%',c.payback??'Never',s.confidence,s.risk,s.notes].map(q).join(',');});
  const blob=new Blob([[cols.map(q).join(','),...rows].join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='investment-funnel-'+today()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}
let tt; function toast(m,ms=2800){ document.querySelector('.toast')?.remove(); const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=m; document.body.appendChild(d); clearTimeout(tt); tt=setTimeout(()=>d.remove(),ms); }

/* Keep the list fresh as teammates submit */
setInterval(()=>{ if(phase==='app'&&view==='list'&&!openId&&!dragId&&!busy&&!document.hidden) load(); },30000);
document.addEventListener('visibilitychange',()=>{ if(phase==='app'&&!document.hidden&&view==='list'&&!openId) load(); });

/* ---------- Boot ---------- */
(async function boot(){
  const problems=configProblems();
  if(problems.length){ phase='config'; gateErr=problems; render(); return; }
  render();
  try{ await startAuth(); }
  catch(e){ console.error(e); phase='signin'; gateErr=authErrorInfo(e); render(); return; }
  if(!account){ phase='signin'; render(); return; }
  await connect();
})();
</script>
